name: Nightly Dashboard Build

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CI: true
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  nightly-build-and-push:
    name: Build and publish nightly dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protobuf TypeScript bindings
        run: pnpm --filter @meshtastic/protobufs build

      - name: Lint and format checks
        run: pnpm check

      - name: Typecheck dashboard
        run: pnpm --filter meshtastic-web typecheck

      - name: Run workspace tests
        run: pnpm test --run

      - name: Build dashboard
        run: pnpm --filter meshtastic-web build

      - name: Package dashboard artifact
        run: pnpm --filter meshtastic-web package

      - name: Upload packaged dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dmdash-web-nightly
          path: packages/web/dist/build.tar
          if-no-files-found: error

      - name: Compute nightly metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          ISO_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORTSHA="$(git rev-parse --short=12 HEAD)"
          echo "moving_tag=nightly" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=nightly-${DATE}-${SHORTSHA}" >> "$GITHUB_OUTPUT"
          echo "created=${ISO_CREATED}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/web/infra/Containerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.moving_tag }}
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.immutable_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          provenance: false

      - name: Print image URLs
        run: |
          echo "Moving tag:    ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.moving_tag }}"
          echo "Immutable tag: ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.immutable_tag }}"
