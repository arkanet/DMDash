name: GitHub Packages Container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: github-packages-container-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build-and-push-container:
    name: Build and publish dashboard container
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protobuf TypeScript bindings
        run: pnpm --filter @meshtastic/protobufs build

      - name: Lint and format checks
        run: pnpm check

      - name: Typecheck dashboard
        run: pnpm --filter meshtastic-web typecheck

      - name: Run workspace tests
        run: pnpm test --run

      - name: Build dashboard
        run: pnpm --filter meshtastic-web build

      - name: Compute container metadata
        id: container_meta
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          SHORTSHA="$(git rev-parse --short=12 HEAD)"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "registry_image=ghcr.io/${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "shortsha=${SHORTSHA}" >> "$GITHUB_OUTPUT"
          echo "created=${CREATED}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/web/infra/Containerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ steps.container_meta.outputs.registry_image }}:main
            ${{ steps.container_meta.outputs.registry_image }}:edge
            ${{ steps.container_meta.outputs.registry_image }}:sha-${{ steps.container_meta.outputs.shortsha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.container_meta.outputs.created }}
            org.opencontainers.image.title=DMDash Dashboard
            org.opencontainers.image.description=DMDash web dashboard container image
          provenance: false

      - name: Print package refs
        run: |
          echo "GitHub Packages container refs:"
          echo "  docker pull ${{ steps.container_meta.outputs.registry_image }}:main"
          echo "  docker pull ${{ steps.container_meta.outputs.registry_image }}:edge"
          echo "  docker pull ${{ steps.container_meta.outputs.registry_image }}:sha-${{ steps.container_meta.outputs.shortsha }}"
