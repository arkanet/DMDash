name: Feature request
description: Suggest a new feature or improvement for DMDash
title: "[Feature Request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your request. We use this form to separate dashboard UX work, DarkMesh feature ports, Meshtastic compatibility work, and repo automation needs.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      description: Please confirm the following before submitting your feature request
      options:
        - label: I have searched existing issues to ensure this feature hasn't already been requested
          required: true
        - label: I have checked the current dashboard and documentation to verify this idea does not already exist
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      description: Which part of the project would this improve?
      options:
        - Dashboard UI or operator workflow
        - DarkMesh feature parity with Android
        - Meshtastic protobuf or compatibility layer
        - Upstream sync, CI, or release automation
        - Documentation or contributor experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? Describe the limitation, pain point, or missing workflow.
      placeholder: I'm frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your idea for solving the problem. What would you like to see implemented?
      placeholder: It would be great if...
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility notes
      description: If this request touches protobufs, firmware assumptions, or upstream parity, explain the expected compatibility constraints.
      placeholder: This should stay compatible with official Meshtastic protobufs because...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Current Alternatives
      description: Are there any workarounds or alternative solutions you're currently using?
      placeholder: Currently, I'm working around this by...
    validations:
      required: false
  - type: dropdown
    id: importance
    attributes:
      label: Importance
      description: How important is this feature to you?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: What would success look like?
      description: Describe the outcome that would tell us the feature is finished and useful.
      placeholder: Operators should be able to...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, mockups, or examples that might help us understand your request better.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape the DMDash roadmap.
